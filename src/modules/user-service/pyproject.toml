[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.12"
venvPath = "../../.."
venv = ".venv"
stubPath = "stubs"
include = ["app_factory.py", "database_provisioning.py", "features", "shared", "run.py", "tests"]
extraPaths = ["."]

reportMissingTypeStubs = "none"
ignore = ["tests/test_api_contract.py"]

[[tool.basedpyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportPrivateUsage = "none"

[tool.ruff]
line-length = 79
target-version = "py312"
src = ["."]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = ["ALL", "PLR0904", "PLR1702", "PLW0717", "PLW1514"]
ignore = [
    "COM812",
    "CPY001",
    "D",
    "INP001",
    "PERF401",
    "S602",
    "S603",
    "S607",
]

[tool.ruff.lint.pylint]
max-public-methods = 15

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "EM101",
    "EM102",
    "PT009",
    "S101",
    "SLF001",
]

[tool.deptry.per_rule_ignores]
DEP002 = ["alembic", "uvicorn", "bcrypt", "starlette"]

[tool.deptry]
known_first_party = ["run", "app_factory", "database_provisioning", "features", "shared"]
